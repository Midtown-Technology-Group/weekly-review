[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "weekly-review"
version = "0.1.0"
description = "Automated GTD weekly review generator for Logseq knowledge graphs"
readme = "README.md"
license = {text = "AGPL-3.0"}
requires-python = ">=3.10"
authors = [
    {name = "Thomas Bray", email = "thomas.bray@midtowntechgroup.com"}
]
keywords = ["gtd", "logseq", "productivity", "weekly-review", "markdown"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: GNU Affero General Public License v3",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Office/Business :: Scheduling",
]

dependencies = [
    "typer>=0.12.0",
    "rich>=13.0.0",
    "jinja2>=3.1.0",
    "thefuzz>=0.22.0",
    "python-Levenshtein>=0.25.0",  # Speeds up thefuzz
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    "python-dateutil>=2.8.0",
    "pyyaml>=6.0",
    "click>=8.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
    "black>=24.0.0",
    "ruff>=0.4.0",
    "mypy>=1.10.0",
]

[project.scripts]
weekly-review = "weekly_review.cli:main"

[project.urls]
Homepage = "https://github.com/midtowntechgroup/weekly-review"
Issues = "https://github.com/midtowntechgroup/weekly-review/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/weekly_review"]

[tool.black]
line-length = 100
target-version = ['py310']

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "N", "D"]
ignore = ["D100", "D104", "D203", "D213"]

[tool.mypy]
python_version = "3.10"
strict = true
warn_return_any = true
warn_unused_configs = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
